<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рефлексия</title>

<link rel="stylesheet" href="style.css">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>

<body>

<h1 class="title">🎮 Рефлексия разработчика</h1>

<div id="cards" class="container">

    <div class="card green">
        <div class="icon">✔</div>
        <h2>Попробовал</h2>
        <textarea id="tried" placeholder="Опиши, что ты хотел сделать"></textarea>
    </div>

    <div class="card red">
        <div class="icon">✖</div>
        <h2>Застрял</h2>
        <textarea id="stuck" placeholder="Что пошло не так?"></textarea>
    </div>

    <div class="card blue">
        <div class="icon">⚙</div>
        <h2>Решение</h2>
        <textarea id="solution" placeholder="Как улучшить?"></textarea>
    </div>

</div>

<div class="buttons">
    <button onclick="downloadImage()">📸 Скачать</button>
    <button onclick="generateFeedback()">🤖 AI фидбек</button>
</div>

<div id="feedback" class="feedback"></div>

<script src="app.js"></script>

</body>
</html>
